name: Feature Suggestion
description: Suggest an improvement or enhancement to existing features
title: "[Suggestion] "
labels: ["enhancement"]
body:
  - type: markdown
      attributes:
            value: |
                    Thanks for taking the time to suggest an improvement!
                      - type: textarea
                          id: suggestion-description
                              attributes:
                                    label: Suggestion Description
                                          description: Describe your suggestion clearly and concisely.
                                                placeholder: Tell us what you would like to see improved...
                                                    validations:
                                                          required: true
                                                            - type: textarea
                                                                id: current-behavior
                                                                    attributes:
                                                                          label: Current Behavior
                                                                                description: What is the current behavior?
                                                                                      placeholder: Tell us how it currently works...
                                                                                          validations:
                                                                                                required: true
                                                                                                  - type: textarea
                                                                                                      id: suggested-behavior
                                                                                                          attributes:
                                                                                                                label: Suggested Behavior
                                                                                                                      description: What would you like to see changed or improved?
                                                                                                                            placeholder: Tell us how you think it should work...
                                                                                                                                validations:
                                                                                                                                      required: true
                                                                                                                                        - type: input
                                                                                                                                            id: paramiko-version
                                                                                                                                                attributes:
                                                                                                                                                      label: paramiko Version (if related)
                                                                                                                                                            description: 'Run this command in terminal: `python -c "import paramiko; print(paramiko.__version__)"`'
                                                                                                                                                                  placeholder: e.g. 4.0.0
                                                                                                                                                                      validations:
                                                                                                                                                                            required: false
                                                                                                                                                                              - type: textarea
                                                                                                                                                                                  id: additional-context
                                                                                                                                                                                      attributes:
                                                                                                                                                                                            label: Additional Context
                                                                                                                                                                                                  description: Add any other context, screenshots, or references about the suggestion here.
                                                                                                                                                                                                        placeholder: Add any other context...
                                                                                                                                                                                                            validations:
                                                                                                                                                                                                                  required: false
                                                                                                                                                                                                                  
